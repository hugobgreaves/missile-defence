<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missile Defence</title><style>html,body{margin:0;height:100%;background:#020a05;overflow:hidden}canvas{display:block;margin:auto}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const GR='#3f6',keys={};let state='start',score=0,hp=1,kills=0,level=1,hi=+(localStorage.getItem('md_hi')||0),best=+(localStorage.getItem('md_best')||1);
let pm=null,enemies=[],shrap=[],parts=[],spawnLeft=0,spawnT=0,waveMsg=0,sweep=0,flash=0;
const L=()=>({x:W/2,y:H-40});
function reset(){score=0;hp=1;kills=0;level=1;pm=null;enemies=[];shrap=[];parts=[];startWave()}
function startWave(){spawnT=2.5;waveMsg=2}
const spd=()=>1+kills*.03;
function boom(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*180+30;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.4+Math.random()*.6,c})}}
function fire(){const l=L();pm={x:l.x,y:l.y-20,a:-Math.PI/2,v:260,trail:[]}}
function detonate(){for(let i=0;i<24;i++){const a=i/24*6.28;shrap.push({x:pm.x,y:pm.y,vx:Math.cos(a)*220+Math.cos(pm.a)*pm.v*.3,vy:Math.sin(a)*220+Math.sin(pm.a)*pm.v*.3,t:.9})}boom(pm.x,pm.y,30,'#ff8');pm=null}
function spawn(){const sp=Math.pow(1.1,level-1),x=W*.05+Math.random()*W*.9,y=-10,l=L(),an=Math.atan2(l.y-y,l.x-x);enemies.push({k:'msl',x,y,a:an,base:an,v:45*sp,r:6,t:0})}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(keys[e.code])return;keys[e.code]=1;
if(e.code==='Space'){if(state==='over'&&overT>0);else if(state!=='play'){reset();state='play'}else if(pm)detonate();else fire()}});
addEventListener('keyup',e=>keys[e.code]=0);
function miss(e){score+=10*level;kills++;level=kills+1;waveMsg=1.2}
function kill(e,i){enemies.splice(i,1);score+=10*level;kills++;level=kills+1;waveMsg=1.2;boom(e.x,e.y,e.k==='air'?40:20,'#fa3')}
let overT=0;function upd(dt){sweep+=dt*1.5;overT-=dt;if(state!=='play')return;waveMsg-=dt;flash-=dt;

if(pm){if(keys.ArrowLeft)pm.a-=2.8*dt;if(keys.ArrowRight)pm.a+=2.8*dt;if(keys.ArrowUp)pm.v=Math.min(600,pm.v+400*dt);if(keys.ArrowDown)pm.v=Math.max(80,pm.v-400*dt);
pm.x+=Math.cos(pm.a)*pm.v*dt;pm.y+=Math.sin(pm.a)*pm.v*dt;pm.trail.push([pm.x,pm.y]);if(pm.trail.length>30)pm.trail.shift();
if(pm.x<-20||pm.x>W+20||pm.y<-20||pm.y>H)pm=null}
const l=L();
if(!enemies.length){spawnT-=dt;if(spawnT<=0){spawn();spawnT=.6}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.t+=dt;const lv=level-1;e.w=e.w||0;
let bias=0;if(e.evT>0){e.evT-=dt;bias=e.evS*e.evA*Math.sin(Math.PI*(1-Math.max(0,e.evT)/e.evD))}
else if(pm&&!e.evDone){const dx=e.x-pm.x,dy=e.y-pm.y,dd=Math.hypot(dx,dy);if(dd<90+lv*12&&(Math.cos(pm.a)*dx+Math.sin(pm.a)*dy)>0){e.evD=e.evT=.9;e.evS=Math.sign(Math.cos(pm.a)*dy-Math.sin(pm.a)*dx)||1;e.evA=Math.min(1.1,.25+lv*.06);e.evDone=1}}
if(!pm)e.evDone=0;
let d=Math.atan2(l.y-e.y,l.x-e.x)+bias-e.a;d=Math.atan2(Math.sin(d),Math.cos(d));
const tr=.5+lv*.03,tw=Math.max(-tr,Math.min(tr,d*2.5));e.w+=Math.max(-tr*2.5*dt,Math.min(tr*2.5*dt,tw-e.w));e.a+=e.w*dt;
e.vx=Math.cos(e.a)*e.v;e.vy=Math.sin(e.a)*e.v;e.x+=e.vx*dt;e.y+=e.vy*dt;
if(e.x<-30||e.x>W+30||e.y<-60){enemies.splice(i,1);miss(e);continue}
if(Math.hypot(e.x-l.x,e.y-l.y)<24||e.y>H-20){enemies.splice(i,1);boom(e.x,e.y,30,'#f44');if(Math.hypot(e.x-l.x,e.y-l.y)<60){hp=0;flash=.3}else miss(e);continue}
if(pm&&Math.hypot(e.x-pm.x,e.y-pm.y)<e.r+6){kill(e,i);boom(pm.x,pm.y,15,'#ff8');pm=null;continue}
for(const s of shrap)if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+3){kill(e,i);s.t=0;break}}
shrap=shrap.filter(s=>(s.x+=s.vx*dt,s.y+=s.vy*dt,s.vx*=.985,s.vy*=.985,(s.t-=dt)>0));
parts=parts.filter(p=>(p.x+=p.vx*dt,p.y+=p.vy*dt,(p.t-=dt)>0));
if(hp<=0){hp=0;state='over';boom(l.x,l.y,80,'#f44');if(score>hi){hi=score;localStorage.setItem('md_hi',hi)}if(level>best){best=level;localStorage.setItem('md_best',best)}overT=1}}
function txt(s,x,y,sz,c,al){g.font=sz+'px monospace';g.fillStyle=c||GR;g.textAlign=al||'center';g.fillText(s,x,y)}
function draw(){g.fillStyle='#020a05';g.fillRect(0,0,W,H);const l=L(),R=Math.hypot(W/2,H);
g.strokeStyle='rgba(60,255,100,.12)';g.lineWidth=1;for(let r=120;r<R;r+=120){g.beginPath();g.arc(l.x,l.y,r,Math.PI,0);g.stroke()}
for(let a=0;a<=6;a++){g.beginPath();g.moveTo(l.x,l.y);g.lineTo(l.x-Math.cos(a/6*Math.PI)*R,l.y-Math.sin(a/6*Math.PI)*R);g.stroke()}
const sa=Math.PI+(sweep%Math.PI);g.fillStyle='rgba(60,255,100,.07)';g.beginPath();g.moveTo(l.x,l.y);g.arc(l.x,l.y,R,sa-.25,sa);g.fill();
g.fillStyle=GR;g.fillRect(l.x-22,l.y-6,44,14);g.beginPath();g.moveTo(l.x-8,l.y-6);g.lineTo(l.x,l.y-22);g.lineTo(l.x+8,l.y-6);g.fill();g.fillRect(0,H-26,W,1);
for(const e of enemies){g.save();g.translate(e.x,e.y);g.rotate(Math.atan2(e.vy,e.vx));g.fillStyle='#f44';g.strokeStyle='#f44';
if(e.k==='air'){g.beginPath();g.moveTo(14,0);g.lineTo(-10,-12);g.lineTo(-6,0);g.lineTo(-10,12);g.closePath();g.fill()}else{g.fillRect(-7,-2,14,4);g.globalAlpha=.4;g.fillRect(-30,-1,23,2)}g.restore()}
if(pm){g.strokeStyle='rgba(120,255,160,.5)';g.beginPath();pm.trail.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
g.save();g.translate(pm.x,pm.y);g.rotate(pm.a);g.fillStyle='#bfffcf';g.fillRect(-8,-2,16,4);g.restore()}
g.fillStyle='#ff8';for(const s of shrap){g.beginPath();g.arc(s.x,s.y,2.5,0,6.28);g.fill()}
for(const p of parts){g.globalAlpha=Math.min(1,p.t*2);g.fillStyle=p.c;g.fillRect(p.x-1.5,p.y-1.5,3,3)}g.globalAlpha=1;
if(flash>0){g.fillStyle='rgba(255,40,40,'+flash+')';g.fillRect(0,0,W,H)}
txt('SCORE '+score,16,28,18,GR,'left');txt('LEVEL '+level,W/2,28,18);txt('BEST LVL '+Math.max(best,level),W-16,28,18,GR,'right');

if(state==='play'&&waveMsg>0)txt('LEVEL '+level,W/2,H/2,40);
if(state!=='play'){g.fillStyle='rgba(0,10,4,.75)';g.fillRect(0,0,W,H);const y=H/2-110;
txt(state==='over'?'LAUNCHER DESTROYED':'MISSILE DEFENCE',W/2,y,40,state==='over'?'#f44':GR);
if(state==='over')txt('LEVEL REACHED '+level+'   BEST LEVEL '+best+'   SCORE '+score,W/2,y+40,20);
['SPACE  fire interceptor','SPACE (in flight)  detonate → shrapnel','← →  steer missile','↑ ↓  speed up / slow down','One hit on the launcher = game over'].forEach((s,i)=>txt(s,W/2,y+90+i*28,18));
txt('PRESS SPACE TO '+(state==='over'?'RESTART':'START'),W/2,y+250,22,'#ff8')}}
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
